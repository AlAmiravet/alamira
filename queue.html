<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Queue | Al Amira Veterinary Clinic</title>
  <meta name="description" content="Live waiting list - Al Amira Veterinary Clinic">
  <meta name="theme-color" content="#00BCD4">
  <meta name="robots" content="noindex">

  <style>
    :root {
      --bg: #FFFFFF;
      --surface: #FFFFFF;
      --tint: #E8F9FC;
      --tint-2: #CFF3F9;
      --ink: #073B44;
      --muted: #4A6D74;
      --line: #C6EAF0;
      --cyan: #00BCD4;
      --cyan-deep: #007C89;
      --btn-bg: #007C89;
      --btn-fg: #FFFFFF;
      --shadow: 0 18px 40px -24px rgba(0, 124, 137, 0.6);
      --font: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      color: var(--ink);
      font: 400 1rem/1.6 var(--font);
      min-height: 100vh;
      padding: 16px;
      padding-bottom: 40px;
    }

    body.rtl {
      direction: rtl;
      font-family: "Segoe UI", Tahoma, system-ui, sans-serif;
    }

    .wrap {
      max-width: 720px;
      margin: 0 auto;
    }

    /* Top bar */
    .top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 28px;
      flex-wrap: wrap;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
      color: var(--ink);
    }

    .brand-mark {
      width: 40px;
      height: 40px;
      border-radius: 12px;
      background: linear-gradient(145deg, var(--cyan), var(--cyan-deep));
      display: grid;
      place-items: center;
      color: white;
      font-weight: 700;
      font-size: 1.1rem;
    }

    .brand b {
      font-size: 1.15rem;
      font-weight: 700;
      display: block;
      line-height: 1.2;
    }

    .brand small {
      font-size: 0.75rem;
      color: var(--muted);
    }

    .lang {
      display: inline-flex;
      padding: 3px;
      border-radius: 999px;
      background: var(--tint);
      gap: 2px;
    }

    .lang button {
      border: 0;
      background: transparent;
      color: var(--ink);
      font: 600 0.82rem/1 var(--font);
      min-width: 42px;
      min-height: 36px;
      padding: 0 0.55rem;
      border-radius: 999px;
      cursor: pointer;
    }

    .lang button.active {
      background: var(--btn-bg);
      color: var(--btn-fg);
    }

    /* Header */
    .header {
      text-align: center;
      margin-bottom: 20px;
    }

    .header h1 {
      font-size: 1.55rem;
      font-weight: 700;
      color: var(--cyan-deep);
      margin-bottom: 4px;
    }

    .header p {
      color: var(--muted);
      font-size: 0.95rem;
    }

    /* Status */
    .status-bar {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 8px;
      font-size: 0.85rem;
      color: var(--muted);
      margin-bottom: 18px;
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #22c55e;
      animation: pulse 2s infinite;
    }

    .dot.error { background: #ef4444; animation: none; }
    .dot.loading { background: #94a3b8; }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.35; }
    }

    /* Table card */
    .card {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 16px;
      overflow: hidden;
      box-shadow: var(--shadow);
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.92rem;
    }

    th {
      background: var(--tint);
      color: var(--ink);
      font-weight: 600;
      text-align: start;
      padding: 12px 14px;
      font-size: 0.82rem;
      white-space: nowrap;
    }

    td {
      padding: 13px 14px;
      border-top: 1px solid var(--line);
      vertical-align: middle;
      text-align: start;
    }

    tr:first-child td { border-top: 0; }

    .queue-num {
      font-weight: 700;
      font-size: 1.05rem;
      color: var(--cyan-deep);
      font-variant-numeric: tabular-nums;
    }

    .badge {
      display: inline-block;
      padding: 3px 10px;
      border-radius: 999px;
      font-size: 0.78rem;
      font-weight: 600;
      white-space: nowrap;
    }

    .badge-new, .badge-waiting {
      background: #fef3c7;
      color: #b45309;
    }

    .badge-confirmed, .badge-progress {
      background: #dbeafe;
      color: #1d4ed8;
    }

    .badge-done {
      background: #dcfce7;
      color: #15803d;
    }

    .empty, .loading-msg, .error-msg {
      text-align: center;
      padding: 48px 20px;
      color: var(--muted);
    }

    .error-msg {
      color: #b91c1c;
      background: #fef2f2;
      border-radius: 12px;
      margin: 0;
    }

    .back {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      margin-top: 24px;
      color: var(--cyan-deep);
      font-weight: 600;
      font-size: 0.95rem;
      text-decoration: none;
    }

    .back:hover { text-decoration: underline; }

    @media (max-width: 520px) {
      .hide-sm { display: none; }
      th, td { padding: 11px 10px; font-size: 0.88rem; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="top">
      <a class="brand" href="./">
        <div class="brand-mark">A</div>
        <span>
          <b id="brandName">Al Amira</b>
          <small id="brandSub">Veterinary clinic</small>
        </span>
      </a>

      <div class="lang" role="navigation" aria-label="Language">
        <button type="button" data-lang="ar">AR</button>
        <button type="button" data-lang="fr">FR</button>
        <button type="button" data-lang="en" class="active">EN</button>
      </div>
    </div>

    <div class="header">
      <h1 id="title">Live waiting list</h1>
      <p id="subtitle">See when your turn is coming</p>
    </div>

    <div class="status-bar">
      <span class="dot loading" id="statusDot"></span>
      <span id="statusText">Loading...</span>
    </div>

    <div class="card">
      <div id="content">
        <div class="loading-msg" id="loadingMsg">Loading queue...</div>
      </div>
    </div>

    <a class="back" href="./" id="backLink">← Back to website</a>
  </div>

  <script>
    const QUEUE_URL = "https://script.google.com/macros/s/AKfycbydQ9_32H1WH21QzYs-0HPSAJdrwkbfhAsj8VvC8P7zRd-_R9oCb7mFcWs6txeoKUyg5Q/exec?action=queue";
    const REFRESH_MS = 8000;

    const i18n = {
      en: {
        brandName: "Al Amira",
        brandSub: "Veterinary clinic",
        title: "Live waiting list",
        subtitle: "See when your turn is coming",
        loading: "Loading queue...",
        empty: "No one is waiting right now",
        updated: "Updated",
        error: "Could not load the list. Please try again.",
        connection: "Connection problem",
        back: "← Back to website",
        headers: { queue: "N°", status: "Status", time: "Time", animal: "Animal" },
        statusMap: {
          "New": "Waiting",
          "Confirmed": "Confirmed",
          "Done": "Done",
          "No-show": "No-show",
          "Cancelled": "Cancelled"
        }
      },
      fr: {
        brandName: "Al Amira",
        brandSub: "Clinique vétérinaire",
        title: "File d'attente",
        subtitle: "Voyez quand votre tour approche",
        loading: "Chargement...",
        empty: "Personne n'attend pour le moment",
        updated: "Mis à jour",
        error: "Impossible de charger la liste. Réessayez.",
        connection: "Problème de connexion",
        back: "← Retour au site",
        headers: { queue: "N°", status: "Statut", time: "Heure", animal: "Animal" },
        statusMap: {
          "New": "En attente",
          "Confirmed": "Confirmé",
          "Done": "Terminé",
          "No-show": "Absent",
          "Cancelled": "Annulé"
        }
      },
      ar: {
        brandName: "الأميرة",
        brandSub: "عيادة بيطرية",
        title: "قائمة الانتظار",
        subtitle: "اعرف متى يقترب دورك",
        loading: "جاري التحميل...",
        empty: "لا يوجد أحد في قائمة الانتظار حالياً",
        updated: "تم التحديث",
        error: "تعذر تحميل القائمة. حاول مرة أخرى.",
        connection: "مشكلة في الاتصال",
        back: "العودة للموقع →",
        headers: { queue: "الرقم", status: "الحالة", time: "الوقت", animal: "الحيوان" },
        statusMap: {
          "New": "في الانتظار",
          "Confirmed": "مؤكد",
          "Done": "تم",
          "No-show": "لم يحضر",
          "Cancelled": "ملغى"
        }
      }
    };

    let lang = "en";
    let timer = null;

    const $ = (id) => document.getElementById(id);

    function setLang(next) {
      lang = next;
      const t = i18n[lang];

      document.documentElement.lang = lang;
      document.body.classList.toggle("rtl", lang === "ar");

      $("brandName").textContent = t.brandName;
      $("brandSub").textContent = t.brandSub;
      $("title").textContent = t.title;
      $("subtitle").textContent = t.subtitle;
      $("backLink").textContent = t.back;
      document.title = t.title + " | Al Amira";

      document.querySelectorAll(".lang button").forEach(btn => {
        btn.classList.toggle("active", btn.dataset.lang === lang);
      });

      localStorage.setItem("queue-lang", lang);
      loadQueue();
    }

    function statusBadge(status) {
      const t = i18n[lang];
      const label = t.statusMap[status] || status || t.statusMap["New"];
      let cls = "badge-new";
      const s = (status || "").toLowerCase();
      if (s.includes("confirm") || s.includes("progress")) cls = "badge-confirmed";
      if (s.includes("done") || s.includes("terminé") || s.includes("تم")) cls = "badge-done";
      return `<span class="badge ${cls}">${escapeHtml(label)}</span>`;
    }

    function escapeHtml(str) {
      const d = document.createElement("div");
      d.textContent = str || "";
      return d.innerHTML;
    }

    async function loadQueue() {
      const t = i18n[lang];
      const dot = $("statusDot");
      const statusText = $("statusText");
      const content = $("content");

      try {
        const res = await fetch(QUEUE_URL + "&_=" + Date.now());
        if (!res.ok) throw new Error("bad status");

        const data = await res.json();

        if (!Array.isArray(data) || data.length === 0) {
          content.innerHTML = `<div class="empty">${t.empty}</div>`;
        } else {
          let html = `<table>
            <thead>
              <tr>
                <th>${t.headers.queue}</th>
                <th>${t.headers.status}</th>
                <th>${t.headers.time}</th>
                <th class="hide-sm">${t.headers.animal}</th>
              </tr>
            </thead>
            <tbody>`;

          data.forEach(row => {
            const animal = [row.animalType, row.animalName].filter(Boolean).join(" – ");
            html += `<tr>
              <td><span class="queue-num">${escapeHtml(row.queue)}</span></td>
              <td>${statusBadge(row.status)}</td>
              <td>${escapeHtml(row.time)}</td>
              <td class="hide-sm">${escapeHtml(animal)}</td>
            </tr>`;
          });

          html += `</tbody></table>`;
          content.innerHTML = html;
        }

        dot.className = "dot";
        statusText.textContent = t.updated + " " + new Date().toLocaleTimeString();
      } catch (err) {
        console.error(err);
        content.innerHTML = `<div class="error-msg">${t.error}</div>`;
        dot.className = "dot error";
        statusText.textContent = t.connection;
      }
    }

    // Language buttons
    document.querySelectorAll(".lang button").forEach(btn => {
      btn.addEventListener("click", () => setLang(btn.dataset.lang));
    });

    // Initial language
    const saved = localStorage.getItem("queue-lang");
    const path = location.pathname.toLowerCase();
    let start = "en";
    if (saved && i18n[saved]) start = saved;
    else if (path.includes("/fr")) start = "fr";
    else if (!path.includes("/en")) start = "ar"; // default Arabic on root

    setLang(start);

    // Auto refresh
    timer = setInterval(loadQueue, REFRESH_MS);
  </script>
</body>
</html>
