  <p class="qlead">ابحث عن رقمك لتعرف كم شخصًا قبلك. تتحدّث القائمة تلقائيًا.</p>

    <p id="qStatus" class="qstatus" role="status">جارٍ التحميل…</p>
    <ol id="qList" class="qlist"></ol>
  </section>

  <div class="qactions">
    <button type="button" class="btn btn-sm" id="qRefresh">تحديث</button>
    <a class="btn btn-sm btn-ghost" href="../">العودة إلى الموقع</a>
  </div>
  <p class="qnote">تُعرض هنا أرقام الدور فقط، دون أسماء أو أرقام هواتف.</p>
  <noscript><p class="qnote">تحتاج هذه الصفحة إلى جافاسكربت لعرض القائمة.</p></noscript>
