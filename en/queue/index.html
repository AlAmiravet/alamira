<header class="top">

      <img src="../../assets/icons/logo.svg" width="40" height="40" alt="">

<main class="wrap qmain" id="main">
  <p class="eyebrow">Updated: <span id="qUpdated" class="ltr">–</span></p>
  <h1>Today&#39;s queue</h1>
  <p class="qlead">Find your number to see how many are ahead of you. The list updates by itself.</p>

  <section class="qnow" aria-labelledby="qNowH">
    <h2 id="qNowH">Now being seen</h2>
    <div id="qNow" class="qnow-list" aria-live="polite"></div>
  </section>

  <section aria-labelledby="qWaitH">
    <h2 id="qWaitH">Waiting <span id="qCount" class="qcount"></span></h2>
    <p id="qStatus" class="qstatus" role="status">Loading…</p>
    <ol id="qList" class="qlist"></ol>
  </section>

  <div class="qactions">
    <button type="button" class="btn btn-sm" id="qRefresh">Refresh</button>
    <a class="btn btn-sm btn-ghost" href="../">Back to the website</a>
  </div>
  <p class="qnote">Only queue numbers are shown here, never names or phone numbers.</p>
  <noscript><p class="qnote">This page needs JavaScript to show the queue.</p></noscript>
</main>
