name: Publish site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # Rebuild the three language pages, the screenshots list and the hero image from the files in the repo
      - name: Build pages
        run: node scripts/build.mjs

      # Publish only the website files (not the Apps Script, the sources or this workflow)
      - name: Assemble site
        run: |
          mkdir _site
          cp index.html styles.css app.js queue.js queue.css _site/
          cp -r fr en queue assets screenshots _site/
          cp sitemap.xml robots.txt _site/ 2>/dev/null || true

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
